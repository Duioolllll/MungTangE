name: Synthesize 300 upstream skill sources
on:
  push:
    branches: [feat/300-source-skill-synthesis]
    paths:
      - "scripts/analyze-upstream-skills.mjs"
      - "catalog/**"
      - ".github/workflows/synthesize-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and analyze all upstream SHA blobs
        run: npm run analyze:sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit source audit and generated knowledge, including failures
        if: github.ref_name == 'feat/300-source-skill-synthesis'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/source-audit.json docs/SOURCE-AUDIT.md skills/mungtange/references/
          if ! git diff --cached --quiet; then
            git commit -m "research: compile SHA-verified 300-skill source synthesis"
            git push
          fi
      - name: Validate completeness (fails if any source was unavailable)
        run: node scripts/verify-synthesis.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            research/source-audit.json
            docs/SOURCE-AUDIT.md
            skills/mungtange/references/KNOWLEDGE-ROUTER.md
            skills/mungtange/references/DESIGN-DNA.md
            skills/mungtange/references/WEB-ENGINEERING.md
            skills/mungtange/references/AGENT-HARNESS.md
            skills/mungtange/references/SOURCE-INDEX.md
          if-no-files-found: warn
