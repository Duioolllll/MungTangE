name: Build 300-source knowledge cards
on:
  push:
    branches: [feat/300-skill-knowledge-runtime]
    paths:
      - "scripts/build-knowledge.mjs"
      - "scripts/check-knowledge.mjs"
      - "catalog/**"
      - ".github/workflows/build-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch all 300 original SKILL.md Git blobs (SHA-pinned)
        run: npm run knowledge:build && npm run knowledge:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate source coverage, IDs and shard integrity
        run: npm run knowledge:verify
      - name: Commit generated source cards to isolated feature branch
        if: github.ref_name == 'feat/300-skill-knowledge-runtime'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/mungtange/references/knowledge docs/KNOWLEDGE-COVERAGE.md
          if ! git diff --cached --quiet; then
            git commit -m "research: create 300 individually attributed SHA-pinned source cards"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-cards
          path: |
            docs/KNOWLEDGE-COVERAGE.md
            skills/mungtange/references/knowledge/
          if-no-files-found: warn
